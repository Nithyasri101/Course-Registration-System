<html>

<head>
    <title>Register a course</title>
    <Style>
        body {
            background-color: black;
            text-align: center;
        }
        
        form {
            margin: auto;
            padding: 20px;
            width: 400px;
            background-color: #fff;
        }
        
        input,
        select,
        button {
            width: 90%;
            padding: 10px;
            margin: 10px
        }
        
        button {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
            font-size: medium;
            cursor: pointer;
        }
        
        button :hover {
            background-color: #104212;
        }
    </Style>
</head>

<body>
    <h1 style="color:yellow">Kickstart with an exciting course</h1>
    <form action="http://localhost:8080/courses/register" method="post">
        <label for="name">Enter Your Name:</label><br>
        <input type="text" name="name"><br>

        <label for="email">Enter Your emailId:</label><br>
        <input type="email" name="emailId"><br>

        <label for="course">Choose a Course</label><br>
        <select id="course" name="CourseName">
                     <option value="Java Essentials">Java Essentials</option>
                      <option value="Python fo ML">Python for ML</option>
                       <option value="Spring Boot">Spring Boot</option>
                       <option value="AI">AI</option>
          </select>
        <br><br>

        <button type="submit">Submit </button>
</body>

</html>
